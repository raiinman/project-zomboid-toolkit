[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-zomboid-toolkit"
version = "0.3.1"
description = "Shared MCP and CLI tools with a Project Zomboid mod testing harness"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
mcp = ["mcp>=1.12.4,<2"]
dev = ["pytest>=8,<10", "lupa>=2.6,<3"]
exe = ["pyinstaller>=6.22.3,<7; sys_platform == 'win32'"]

[project.scripts]
pz = "pztoolkit.cli:main"

[project.gui-scripts]
pz-app = "pztoolkit.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pztoolkit = ["assets/bridge/**/*", "assets/gui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
