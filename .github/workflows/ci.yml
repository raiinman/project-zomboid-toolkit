name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-contracts:
    name: Offline contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.12'
          enable-cache: true
      - name: Verify lockfile matches package metadata
        run: uv lock --check
      - name: Install toolkit and test dependencies
        run: uv sync --frozen --extra mcp --extra dev --python ${{ matrix.python }}
      - name: Verify dependency compatibility
        run: uv pip check
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q src tests
      - name: Run offline contracts and simulated Lua bridge
        run: uv run --no-sync python -m pytest -q
      - name: Build standalone Windows executable
        id: clean_build
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Scan exact candidate bundle before executable checks
        id: defender
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: ./packaging/scan.ps1 -BundlePath dist/pz-windows -BuildReceipt dist/build-receipt.json -ReceiptPath dist/scan-receipt.json
      - name: Verify executable CLI, assets and MCP protocol
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        run: uv run --no-sync python packaging/verify_exe.py dist/pz-windows/pz/pz.exe dist/scan-receipt.json
      - name: Verify windowed app and bundled bridge
        if: matrix.os == 'windows-latest' && matrix.python == '3.11'
        run: uv run --no-sync python packaging/verify_gui.py dist/pz-windows/PZToolkit/PZToolkit.exe dist/scan-receipt.json
      - name: Retain candidate provenance and scan diagnostics
        if: always() && matrix.os == 'windows-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics-${{ github.sha }}
          path: |
            dist/build-receipt.json
            dist/scan-receipt.json
            dist/native-inputs.json
          if-no-files-found: warn
          retention-days: 14
      - name: Identify unavailable-runner scan for private security staging
        id: security_staging
        if: always() && github.event.repository.private == true && steps.clean_build.outcome == 'success' && steps.defender.outcome == 'failure' && matrix.os == 'windows-latest' && matrix.python == '3.11'
        shell: pwsh
        run: |
          $receipt = Get-Content -LiteralPath dist/scan-receipt.json -Raw | ConvertFrom-Json
          $unavailable = $receipt.schema -eq 1 -and
            $receipt.ok -eq $false -and $receipt.executionApproved -eq $false -and
            $receipt.error -eq 'Defender must be active in Normal mode with current signatures; scan verdict is unknown' -and
            !$receipt.scans -and $null -eq $receipt.scanExitCode -and !$receipt.newDetections
          if ($unavailable) { 'eligible=true' >> $env:GITHUB_OUTPUT }
      - name: Retain UNSCANNED private staging for PC Defender scan only
        if: always() && steps.security_staging.outputs.eligible == 'true' && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UNSCANNED-security-staging-${{ github.sha }}
          path: |
            dist/pz-windows.zip
            dist/build-receipt.json
            dist/native-inputs.json
            dist/scan-receipt.json
          if-no-files-found: error
          retention-days: 2
      - name: Retain scanned Windows candidate
        if: success() && steps.defender.outcome == 'success' && matrix.os == 'windows-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            dist/pz-windows.zip
            dist/build-receipt.json
            dist/scan-receipt.json
          if-no-files-found: error
          retention-days: 14
      # Live gameplay requires the user's installed game and an isolated debug
      # profile. Simulated transport tests do not constitute live acceptance.
